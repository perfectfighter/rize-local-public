name: Build Windows desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pinned dependencies
        run: npm ci
      - name: Test desktop and companion service
        run: npm test
      - name: Build production renderer
        run: npm run build
      - name: Package portable Windows x64 app
        run: npm run package:windows
      - name: Package unsigned Windows NSIS installer
        run: npm run package:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: rize-local-windows-x64
          path: |
            release/rize-local-windows-x64.zip
            release/rize-local-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload installer build
        uses: actions/upload-artifact@v4
        with:
          name: rize-local-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
