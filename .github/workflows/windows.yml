name: Build Windows desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pinned dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production renderer
        run: npm run build
      - name: Package portable Windows x64 app
        run: npm run package:windows
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: rize-local-windows-x64
          path: |
            release/rize-local-windows-x64.zip
            release/rize-local-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
